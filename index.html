  <script>
    // The cinematic title font is critical on these two routes only. Other
    // pages should not compete with an unused font during their first paint.
    if (location.pathname === '/' || location.pathname === '/portfolio') {
      const titleFont = document.createElement('link');
      titleFont.rel = 'preload';
      titleFont.href = '/fonts/TRTCENZODEMO-ExtraBold.ttf';
      titleFont.as = 'font';
      titleFont.type = 'font/ttf';
      titleFont.crossOrigin = 'anonymous';
      document.head.append(titleFont);
    }
  </script>

  <script>
    const titles = [
      "BOLTFORGED",
      "Probably Overengineering Something",
  "Ctrl + Z Doesn’t Work in Real Life",
  "Built With 3 Tabs of StackOverflow",
  "This Took Way Too Long To Make",
  "Yes, It’s Supposed To Look Like That",
  "Turning Coffee Into Bad Decisions",
  "If It Compiles, Ship It",
  "Currently Pretending To Be Productive",
  "Works On My Machine™",
  "We Fixed One Bug And Made Three More",
  "Professional Button Mover",
  "Designing At 3AM Again",
  "Bold Of You To Assume This Was Planned",
  "Engineering But With Vibes",
  "99% Debugging 1% Genius"
    ];

    const randomTitle = titles[Math.floor(Math.random() * titles.length)];
    document.title = randomTitle;
  </script>
